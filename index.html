const DIMS={COMPROMISSOS:{max:25,label:'Compromissos',s:'COMP'},FINANCEIRO:{max:25,label:'Financeiro',s:'FIN'},COMUNICACAO:{max:15,label:'Comunicação',s:'COM'},OPERACIONAL:{max:20,label:'Histórico operacional',s:'OPER'},RECIPROCIDADE:{max:15,label:'Reciprocidade/transparência',s:'RECIP'}};
const ICI_CFG={baseline:0.65,prior:1,halfLife:180,val:{POS:[0.9,1,1],NEU:[0.65,0.65,0.65],NEG:[0.3,0.1,0]}};

let S=emptyState();
function emptyState(){return {version:1,settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),contacts:[],items:[],events:[],iciLog:[]};}
function load(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);S=Object.assign(emptyState(),d);S.settings=Object.assign({},DEFAULT_SETTINGS,d.settings||{});}}catch(e){console.error(e);}}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---------- datas (strings locais YYYY-MM-DD) ---------- */
const pad=n=>String(n).padStart(2,'0');
function nowD(){return window.__NOW?new Date(window.__NOW):new Date();}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return ds(nowD());}
function nowHM(){const d=nowD();return pad(d.getHours())+':'+pad(d.getMinutes());}
function parseDs(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseDs(s);d.setDate(d.getDate()+n);return ds(d);}
function addMonths(s,n){const d=parseDs(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ds(d);}
function diffDays(a,b){return Math.round((parseDs(b)-parseDs(a))/86400000);}
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const WDL=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function fmtD(s){if(!s)return '';const d=parseDs(s);return WD[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1);}
function fmtDL(s){const d=parseDs(s);const w=WDL[d.getDay()];return w.charAt(0).toUpperCase()+w.slice(1)+', '+d.getDate()+' de '+MES[d.getMonth()]+' de '+d.getFullYear();}
function relD(s){const n=diffDays(todayStr(),s);if(n===0)return 'hoje';if(n===1)return 'amanhã';if(n===-1)return 'ontem';if(n<0)return 'há '+(-n)+'d';return 'em '+n+'d';}
const brl=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- acessores ---------- */
const contact=id=>S.contacts.find(c=>c.id===id);
const cName=c=>c?(c.fantasia||c.nome):'';
const isSupplier=c=>c&&['FORNECEDOR','FABRICANTE','REPRESENTANTE'].includes(c.tipo);
const isOpen=it=>OPEN.has(it.status);
function contactEvents(cid){return S.events.filter(e=>e.contatoId===cid).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.ts||0)-(b.ts||0));}
function lastContact(cid){let m=null;for(const e of S.events)if(e.contatoId===cid&&(!m||e.data>m))m=e.data;return m;}
function nextContact(cid){let m=null,it=null;for(const i of S.items)if(i.contatoId===cid&&isOpen(i)){const d=itemDue(i);if(!m||d<m){m=d;it=i;}}return it?{data:m,item:it}:null;}
function itemDue(it){let d=it.data;if(isOpen(it)&&it.prazoProxima&&it.prazoProxima<d)d=it.prazoProxima;return d;}
function waLink(num,txt){let d=String(num||'').replace(/\D/g,'');if(!d)return null;if(d.length<=11)d='55'+d;return 'https://wa.me/'+d+(txt?'?text='+encodeURIComponent(txt):'');}

/* ---------- ICI (Índice de Credibilidade IN'TEGRA) ---------- */
function iciCompute(cid,evsIn,ref){
  const evs=(evsIn||S.events.filter(e=>e.contatoId===cid)).filter(e=>e.dimensao&&DIMS[e.dimensao]);
  if(!evs.length)return null;
  const R=ref||todayStr();const dims={};let total=0;
  for(const k in DIMS){
    const list=evs.filter(e=>e.dimensao===k);let num=ICI_CFG.baseline*ICI_CFG.prior,den=ICI_CFG.prior;
    for(const e of list){const age=Math.max(0,diffDays(e.data,R));const rec=Math.pow(0.5,age/ICI_CFG.halfLife);const sev=clamp(+e.severidade||1,1,3);const w=rec*(1+0.5*(sev-1));const v=ICI_CFG.val[e.resultado||'NEU'][sev-1];num+=w*v;den+=w;}
    const ratio=num/den;const pts=ratio*DIMS[k].max;dims[k]={ratio,pts,n:list.length};total+=pts;
  }
  return {score:Math.round(total),raw:Math.round(total*10)/10,dims,n:evs.length};
}
function iciBand(score){if(score==null)return {k:'SEM',l:'SEM HISTÓRICO'};if(score>=90)return {k:'EXC',l:'EXCEPCIONAL'};if(score>=75)return {k:'CONF',l:'CONFIÁVEL'};if(score>=60)return {k:'ATEN',l:'ATENÇÃO'};if(score>=40)return {k:'RISC',l:'RISCO'};return {k:'CRIT',l:'CRÍTICO'};}
function iciOf(cid){return cid?iciCompute(cid):null;}
function evMotivo(e){const d=DIMS[e.dimensao];return (e.resultado==='POS'?'+':e.resultado==='NEG'?'−':'±')+' '+d.label+' ('+RES_LABEL[e.resultado||'NEU']+', severidade '+(e.severidade||1)+'): '+(e.descricao||e.tipo);}
function logIci(cid,before,after,ev,motivo,data){
  S.iciLog.push({id:uid(),contatoId:cid,data:data||todayStr(),ts:Date.now(),eventoId:ev?ev.id:null,evento:ev?(ev.tipo+' — '+(ev.descricao||'')):'(recálculo)',anterior:before?before.score:null,nova:after?after.score:null,anteriorExato:before&&before.raw!=null?before.raw:null,novaExata:after&&after.raw!=null?after.raw:null,motivo});
}
function addEvent(ev,opts={}){
  ev.id=ev.id||uid();ev.ts=ev.ts||Date.now();ev.data=ev.data||todayStr();
  const before=ev.contatoId&&ev.dimensao?iciCompute(ev.contatoId,opts.subset):null;
  S.events.push(ev);
  if(ev.contatoId&&ev.dimensao){const sub=opts.subset?opts.subset.concat([ev]):null;const after=iciCompute(ev.contatoId,sub);logIci(ev.contatoId,before,after,ev,evMotivo(ev),opts.logDate||todayStr());}
  return ev;
}
function deleteEvent(id){const ev=S.events.find(e=>e.id===id);if(!ev)return;const before=ev.contatoId&&ev.dimensao?iciCompute(ev.contatoId):null;S.events=S.events.filter(e=>e.id!==id);if(ev.contatoId&&ev.dimensao){logIci(ev.contatoId,before,iciCompute(ev.contatoId),ev,'Evento removido do histórico: '+(ev.descricao||ev.tipo));}}
function iciDecayCheck(){ // registra mudanças por decaimento temporal para que TODA alteração de nota fique no log
  let ch=0;for(const c of S.contacts){const cur=iciCompute(c.id);const logs=S.iciLog.filter(l=>l.contatoId===c.id);const last=logs[logs.length-1];const lastScore=last?last.nova:null;const curScore=cur?cur.score:null;
    if(last&&lastScore!==curScore){logIci(c.id,{score:lastScore},cur,null,'Recálculo automático por decaimento temporal (eventos antigos perdem peso; meia-vida '+ICI_CFG.halfLife+' dias)');ch++;}}
  return ch;
}

/* ---------- PRIORIDADE INTELIGENTE ---------- */
function priority(it){
  const f=[];const t=todayStr();const due=itemDue(it);const dd=diffDays(t,due);const c=contact(it.contatoId);const ici=c?iciCompute(c.id):null;
  let U;if(dd<0){U=35;f.push(['Urgência',35,'prazo vencido há '+(-dd)+' dia(s)']);}
  else if(dd===0){U=it.hora?30:28;f.push(['Urgência',U,'vence hoje'+(it.hora?' às '+it.hora:'')]);}
  else if(dd===1){U=20;f.push(['Urgência',20,'vence amanhã']);}
  else if(dd<=3){U=14;f.push(['Urgência',14,'vence em '+dd+' dias']);}
  else if(dd<=7){U=8;f.push(['Urgência',8,'vence em '+dd+' dias']);}
  else {U=3;f.push(['Urgência',3,'prazo distante ('+dd+' dias)']);}
  const valor=+it.valor||0;let F=0;if(valor>0){F=Math.min(20,Math.round(20*Math.log10(1+valor)/Math.log10(1+50000)));f.push(['Impacto financeiro',F,brl(valor)+' envolvidos']);}
  let I=0;if(c&&c.valorImportancia){I=clamp(+c.valorImportancia,0,5)*3;f.push(['Importância do contato',I,'valor comercial '+c.valorImportancia+'/5']);}
  let R=0;const rp=+it.riscoPerda||0;if(rp){R+=rp*3;f.push(['Risco de perda',rp*3,['','baixo','médio','alto'][rp]]);}
  if(['COBRANÇA','VENCIMENTO'].includes(it.tipo)&&dd<0){R+=4;f.push(['Risco',4,'dinheiro/vencimento atrasado']);}
  if(ici&&ici.score<60){if(it.direcao==='TERCEIRO'){R+=4;f.push(['Credibilidade da contraparte',4,'ICI '+ici.score+' e você depende dele: cobrar de perto']);}
    if(it.tipo==='COBRANÇA'){R+=5;f.push(['Credibilidade da contraparte',5,'ICI '+ici.score+': risco de inadimplência']);}
    if(ici.score<40){R+=2;f.push(['Credibilidade crítica',2,'ICI abaixo de 40']);}}
  R=Math.min(15,R);
  let D=0;if(it.direcao!=='TERCEIRO'){if(c&&['CLIENTE','PROSPECT'].includes(c.tipo)){D=6;f.push(['Dependência',6,'cliente está esperando por você']);}else{D=3;f.push(['Dependência',3,'depende de você']);}
    const waiting=S.items.filter(x=>x.id!==it.id&&isOpen(x)&&x.dependeDe===it.id).length;if(waiting){D=Math.min(10,D+2*waiting);f.push(['Dependência',2*waiting,waiting+' item(ns) aguardam este']);}}
  let O=0;if(c&&(c.tipo==='PROSPECT'||['PROSPECÇÃO','VISITA COMERCIAL','ORÇAMENTO'].includes(it.tipo))){const pot=+c.valorPotencial||0;O=pot>=50000?5:pot>=15000?4:pot>0?2:1;f.push(['Oportunidade futura',O,pot?'potencial '+brl(pot):'nova oportunidade']);}
  const score=Math.min(100,U+F+I+R+D+O);
  let level;if(dd<0||score>=65)level='P1';else if(dd===0||score>=45)level='P2';else if(dd<=7||score>=25)level='P3';else level='P4';
  return {score,level,dd,factors:f,comp:{IMPACTO:F+D+O,'URGÊNCIA':U,VALOR:I,RISCO:R}};
}
const P_LABEL={P1:'P1 AGORA',P2:'P2 HOJE',P3:'P3 PROGRAMADO',P4:'P4 ACOMPANHAR'};

/* ---------- ALERTAS IMPLACÁVEIS (calculados, nunca "dispensados") ---------- */
const SEV_ORDER={'CRÍTICO':0,'ALTO':1,'MÉDIO':2,'INFO':3};
function A(sev,kind,text,sub,ref){return Object.assign({sev,kind,text,sub:sub||''},ref||{});}
function alertsForItem(it,t){
  t=t||todayStr();const L=[];if(!isOpen(it))return L;const dd=diffDays(t,it.data);const c=contact(it.contatoId);const nm=c?cName(c):(it._novoContato||'');const ref={itemId:it.id,contatoId:it.contatoId};const who=nm?' — '+nm:'';
  const money=['COBRANÇA','VENCIMENTO'].includes(it.tipo);
  if(money){
    if(it.tipo==='COBRANÇA'){if(dd<0)L.push(A('CRÍTICO','pagamento','PAGAMENTO ATRASADO há '+(-dd)+'d: '+it.descricao+who,it.valor?brl(it.valor):'',ref));else if(dd<=3)L.push(A('ALTO','pagamento','Pagamento/cobrança vence '+relD(it.data)+': '+it.descricao+who,it.valor?brl(it.valor):'',ref));}
    else{if(dd<0)L.push(A('CRÍTICO','vencimento','VENCIDO há '+(-dd)+'d: '+it.descricao+who,'documento/licença/pagamento',ref));else if(dd<=(S.settings.diasVencimento||15))L.push(A(dd<=3?'ALTO':'MÉDIO','vencimento','Documento/licença/pagamento vence '+relD(it.data)+': '+it.descricao+who,'',ref));}
  } else if(dd<0)L.push(A('CRÍTICO','atrasado','ATRASADO há '+(-dd)+'d: '+it.descricao+who,it.tipo,ref));
  else if(dd===0)L.push(A(it.hora?'ALTO':'MÉDIO','proximo','HOJE'+(it.hora?' às '+it.hora:'')+': '+it.descricao+who,it.tipo,ref));
  else if(dd===1)L.push(A('MÉDIO','proximo','AMANHÃ'+(it.hora?' às '+it.hora:'')+': '+it.descricao+who,it.tipo,ref));
  if(it.prazoProxima&&it.prazoProxima<t&&dd>=0)L.push(A('ALTO','prox_vencida','Próxima ação vencida: '+it.proximaAcao+who,'prazo era '+fmtD(it.prazoProxima),ref));
  if(['ENTREGA','COMPRA'].includes(it.tipo)&&it.direcao==='TERCEIRO'&&dd<=0)L.push(A(dd<0?'CRÍTICO':'ALTO','fornecedor','Fornecedor deveria entregar '+(dd<0?'(atrasado '+(-dd)+'d)':'hoje')+': '+it.descricao+who,'',ref));
  if(it.tipo==='COMPRA'&&it.status==='AGUARDANDO TERCEIRO')L.push(A('MÉDIO','peca','Peça aguardada: '+it.descricao+who,'previsão '+fmtD(it.data),ref));
  if(['INSTALAÇÃO','MANUTENÇÃO','ATENDIMENTO'].includes(it.tipo)&&(it.status==='AGUARDANDO TERCEIRO'||((it.materiais||[]).length&&!it.materiaisOk&&dd<=3)))
    L.push(A('ALTO','material','Serviço aguardando material: '+((it.materiais||[]).join(', ')||it.descricao)+who,it.status==='AGUARDANDO TERCEIRO'?'status: aguardando terceiro':'confirme a separação dos materiais ('+relD(it.data)+')',ref));
  if(['ORÇAMENTO','RETORNO AO CLIENTE'].includes(it.tipo)&&it.direcao!=='TERCEIRO'&&dd>=0)L.push(A(dd<=0?'ALTO':'MÉDIO','aguardando','Cliente aguardando '+(it.tipo==='ORÇAMENTO'?'orçamento':'retorno')+': '+it.descricao+who,'prazo '+relD(it.data),ref));
  if(it.tipo==='MANUTENÇÃO'&&dd>3&&dd<=30&&/prevent/i.test(it.descricao||''))L.push(A('INFO','preventiva','Manutenção preventiva em '+dd+' dias: '+it.descricao+who,'',ref));
  if(it.condicao&&dd<=1&&dd>=0)L.push(A('MÉDIO','condicional','Ação condicional '+relD(it.data)+': verificar "'+it.condicao+'"'+who,it.descricao,ref));
  return L;
}
function contactAlerts(t){
  t=t||todayStr();const L=[];const st=S.settings;
  for(const c of S.contacts){
    const evs=contactEvents(c.id);if(!evs.length)continue;const last=evs[evs.length-1].data;const gap=diffDays(last,t);const hasOpen=S.items.some(i=>i.contatoId===c.id&&isOpen(i));
    if(['CLIENTE'].includes(c.tipo)&&gap>st.diasSemContato&&!hasOpen)L.push(A(gap>st.diasInativo?'ALTO':'MÉDIO','sem_retorno','Cliente sem contato há '+gap+' dias: '+cName(c),'último contato '+fmtD(last)+' · nenhuma ação agendada',{contatoId:c.id}));
    if(c.tipo==='PROSPECT'&&gap>st.diasOportParada&&!hasOpen)L.push(A('MÉDIO','oport_parada','Oportunidade parada há '+gap+' dias: '+cName(c),c.valorPotencial?'potencial '+brl(c.valorPotencial):'',{contatoId:c.id}));
    const hasFU=S.items.some(i=>i.contatoId===c.id&&isOpen(i)&&['FOLLOW-UP','RETORNO AO CLIENTE','ORÇAMENTO'].includes(i.tipo));
    if(!hasFU)for(const e of evs){if(e.tipo!=='ORÇAMENTO ENVIADO')continue;const age=diffDays(e.data,t);if(age<st.diasOrcFollow)continue;
      const later=evs.some(x=>x.data>e.data&&['ORÇAMENTO APROVADO','ORÇAMENTO PERDIDO','CONVERSA','NEGOCIAÇÃO'].includes(x.tipo));
      if(!later)L.push(A('ALTO','orc_sem_follow','Orçamento sem follow-up há '+age+' dias: '+cName(c),(e.descricao||'')+(e.valor?' · '+brl(e.valor):''),{contatoId:c.id,valor:+e.valor||0,eventoId:e.id}));}
  }
  return L;
}
function allAlerts(){const t=todayStr();let L=[];for(const it of S.items)L=L.concat(alertsForItem(it,t));L=L.concat(contactAlerts(t));return L.sort((a,b)=>SEV_ORDER[a.sev]-SEV_ORDER[b.sev]);}

/* ---------- automação de status ---------- */
function hist(it,acao,detalhe){(it.historico=it.historico||[]).push({ts:new Date().toISOString(),acao,detalhe:detalhe||''});}
function refreshAuto(){let ch=false;const t=todayStr();for(const it of S.items){if(isOpen(it)&&it.status!=='ATRASADO'&&it.data<t){it.statusAntes=it.status;it.status='ATRASADO';hist(it,'ATRASADO (automático)','prazo '+fmtD(it.data)+' passou sem conclusão');ch=true;}}if(ch)save();return ch;}

/* ---------- regra da próxima ação ---------- */
function validateItem(it){
  const e=[];if(!it.descricao||!it.descricao.trim())e.push('Descrição obrigatória.');if(!it.tipo)e.push('Tipo obrigatório.');if(!it.data)e.push('Data obrigatória.');
  if(isOpen(it)&&(!it.proximaAcao||!it.proximaAcao.trim()||!it.prazoProxima))e.push('REGRA DA PRÓXIMA AÇÃO: item aberto não pode ser salvo sem PRÓXIMA AÇÃO e PRAZO.');
  if(it.status==='CANCELADO'&&!(it.justificativa||'').trim())e.push('Cancelamento exige justificativa.');
  return e;
}
function defaultNext(tipo,data,desc,cond){
  const t=todayStr();const vesp=data?(addDays(data,-1)<t?t:addDays(data,-1)):t;
  switch(tipo){
    case 'INSTALAÇÃO':case 'MANUTENÇÃO':case 'ATENDIMENTO':return {a:'Confirmar materiais separados e horário com o cliente (véspera)',p:vesp};
    case 'VISITA COMERCIAL':case 'REUNIÃO':return {a:'Confirmar agenda por WhatsApp (véspera)',p:vesp};
    case 'COBRANÇA':return cond?{a:'Verificar se o pagamento entrou antes de cobrar (condição: '+cond+')',p:data||t}:{a:'Enviar cobrança/2ª via e ligar',p:data||t};
    case 'COMPRA':return {a:'Confirmar envio/rastreio com fornecedor',p:data?(addDays(data,-1)<t?t:addDays(data,-1)):t};
    case 'ENTREGA':return {a:'Confirmar entrega/recebimento',p:data||t};
    case 'ORÇAMENTO':return {a:'Enviar orçamento ao cliente',p:data||t};
    default:return {a:desc||'Executar ação',p:data||t};
  }
}
function nextTemplates(it){

  const add=(key,label,tipo,desc,days,dir,months)=>{const data=months?addMonths(T,months):addDays(T,days);const k=tipo+data;if(seen.has(k))return;seen.add(k);L.push({key,label,tipo,desc,data,dir:dir||'MIM'});};
  switch(it.tipo){

    case 'REUNIÃO':add('ata','Reunião → enviar resumo e próximos passos amanhã','FOLLOW-UP','Enviar resumo da reunião e próximos passos',1);break;
    case 'ENTREGA':add('rec','Entrega feita → confirmar recebimento em 2 dias','PÓS-VENDA','Confirmar recebimento e satisfação',2);break;

function stars(n){n=+n||0;return '<span class="stars">'+'★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(5-n)+'</span></span>';}

function contactPrio(cid){let best=null;for(const it of S.items)if(it.contatoId===cid&&isOpen(it)){const p=priority(it);if(!best||p.score>best.score)best=p;}return best;}

  ${it.condicao?`<div class="cond">⚑ CONDICIONAL: ${h(it.condicao)}</div>`:''}
  ${(it.materiais||[]).length?`<div class="meta" style="margin-top:4px">🧰 ${h(it.materiais.join(' · '))} ${it.materiaisOk?'<b style="color:var(--ok)">✓ separados</b>':'<b style="color:var(--p2)">a separar</b>'}</div>`:''}
  ${o.comp?`<div class="comp">${Object.entries(p.comp).map(([k,v])=>`<span>${k} ${v}</span>`).join('')}<span>= ${p.score}</span></div>`:''}
  ${isOpen(it)?`<details class="why" data-stop><summary>▸ por quê ${p.level}? (score ${p.score}/100)</summary><table>${p.factors.map(f=>`<tr><td>${h(f[0])}: ${h(f[2])}</td><td class="pts">+${f[1]}</td></tr>`).join('')}</table></details>

  </div>`;
}

function viewHoje(){
  const T=todayStr();const open=S.items.filter(isOpen).map(i=>({i,p:priority(i)}));const by=(a,b)=>b.p.score-a.p.score;
  const alerts=allAlerts();
  let html=`<div class="hero"><h2>HOJE — IN’TEGRA FUEL</h2><div class="d">${fmtDL(T)}</div><div class="motto">NÃO PERCA A DIREÇÃO.</div></div>`;
  if(!S.contacts.length&&!S.items.length){return html+`<div class="card empty"><b>Agenda vazia.</b>Digite um comando na barra acima (ex.: <i>"Quarta-feira instalar réguas no Posto Energy, levar 2 breakaways 3/4"</i>) ou toque em <b>+</b>.<br><br><button class="btn pri" data-act="sample">Carregar dados de exemplo (fictícios)</button></div>`;}
  const atras=open.filter(x=>x.i.status==='ATRASADO');const p1=open.filter(x=>x.p.level==='P1');
  const orcAlerts=alerts.filter(a=>a.kind==='orc_sem_follow');const orcR=orcAlerts.reduce((s,a)=>s+(a.valor||0),0);
  const receber=open.filter(x=>x.i.tipo==='COBRANÇA').reduce((s,x)=>s+(+x.i.valor||0),0);
  html+=`<div class="kpis"><div class="kpi red" data-go="agenda/atrasados"><b>${atras.length}</b><span>atrasados</span></div><div class="kpi or" data-go="agenda/p1"><b>${p1.length}</b><span>P1 agora</span></div><div class="kpi yl" data-go="alertas"><b>${brl(orcR)}</b><span>orç. sem follow-up</span></div><div class="kpi gr" data-go="agenda/cobranca"><b>${brl(receber)}</b><span>a receber</span></div></div>`;
  const top=open.slice().sort(by).slice(0,3);
  if(top.length)html+=secH('3 prioridades de maior impacto')+`<div class="top3">${top.map((x,k)=>itemCard(x.i,{rank:k+1,comp:true})).join('')}</div>`;
  const used=new Set(top.map(x=>x.i.id));const pick=pred=>{const r=open.filter(x=>!used.has(x.i.id)&&pred(x.i)).sort(by);r.forEach(x=>used.add(x.i.id));return r;};
  const dd=i=>diffDays(T,i.data);
  const S_=[];
  const atrasL=pick(i=>i.status==='ATRASADO');
  const atendL=pick(i=>i.data===T&&['ATENDIMENTO','INSTALAÇÃO','MANUTENÇÃO'].includes(i.tipo));
  const cobrL=pick(i=>['COBRANÇA','VENCIMENTO'].includes(i.tipo)&&dd(i)<=7);
  const hojeL=pick(i=>i.data===T);
  const orcL=pick(i=>i.tipo==='ORÇAMENTO'&&dd(i)<=7);
  const aguardL=pick(i=>['RETORNO AO CLIENTE','FOLLOW-UP','PÓS-VENDA'].includes(i.tipo)&&i.direcao!=='TERCEIRO'&&dd(i)<=3);
  const fornL=pick(i=>(i.direcao==='TERCEIRO'||isSupplier(contact(i.contatoId)))&&dd(i)<=7);
  const oporL=pick(i=>['PROSPECÇÃO','VISITA COMERCIAL'].includes(i.tipo)&&dd(i)<=7);
  const amL=pick(i=>dd(i)===1),d7=pick(i=>dd(i)<=7),d30=pick(i=>dd(i)<=30);
  const cards=L=>L.map(x=>itemCard(x.i)).join('');
  if(hojeL.length)html+=secH('Compromissos de hoje',hojeL.length)+cards(hojeL);
  if(atendL.length)html+=secH('Atendimentos programados',atendL.length)+cards(atendL);
  const crit=alerts.filter(a=>a.sev==='CRÍTICO'||a.sev==='ALTO');
  if(crit.length)html+=secH('Alertas críticos',crit.length)+crit.slice(0,6).map(alertRow).join('')+(crit.length>6||alerts.length>crit.length?`<button class="btn sm" data-go="alertas" style="width:100%">ver todos os ${alerts.length} alertas</button>`:'');
  const semRet=alerts.filter(a=>a.kind==='sem_retorno');
  if(aguardL.length||semRet.length)html+=secH('Clientes aguardando retorno',aguardL.length+semRet.length)+cards(aguardL)+semRet.map(alertRow).join('');
  if(orcL.length||orcAlerts.length)html+=secH('Orçamentos para follow-up',orcL.length+orcAlerts.length)+cards(orcL)+orcAlerts.map(alertRow).join('');
  if(cobrL.length)html+=secH('Pagamentos / cobranças',cobrL.length)+cards(cobrL);
  if(fornL.length)html+=secH('Fornecedores aguardando ação',fornL.length)+cards(fornL);
  const opA=alerts.filter(a=>a.kind==='oport_parada');
  if(oporL.length||opA.length)html+=secH('Oportunidades',oporL.length+opA.length)+cards(oporL)+opA.map(alertRow).join('');
  if(atrasL.length)html+=secH('Atrasados',atrasL.length)+cards(atrasL);
  const col=(t,L)=>L.length?`<details class="col"><summary><span>${t}</span><span>${L.length} ▾</span></summary>${cards(L)}</details>`:'';
  html+=col('AMANHÃ',amL)+col('PRÓXIMOS 7 DIAS',d7)+col('PRÓXIMOS 30 DIAS',d30);
  if(!open.length)html+=`<div class="card empty"><b>Nada pendente.</b>Tudo concluído — registre o próximo passo pela barra de comando.</div>`;
  return html;
}

  if(F.tipo)L=L.filter(i=>i.tipo===F.tipo);if(F.dir)L=L.filter(i=>isOpen(i)&&(i.direcao||'MIM')===F.dir);
  if(F.prio)L=L.filter(i=>isOpen(i)&&priority(i).level===F.prio);if(F.dia)L=L.filter(i=>F.dia==='late'?i.data<T:i.data===F.dia);
  if(F.q){const q=norm(F.q);L=L.filter(i=>norm(i.descricao+' '+cName(contact(i.contatoId))).includes(q));}
  L.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.hora||'99')<(b.hora||'99')?-1:1);
  const openAll=S.items.filter(isOpen);let strip=`<div class="days"><div class="day late ${F.dia==='late'?'on':''}" data-day="late"><span>atras.</span><b>⚠</b><i>${openAll.filter(i=>i.data<T).length||''}</i></div>`;
  for(let k=0;k<21;k++){const d=addDays(T,k);const n=openAll.filter(i=>i.data===d).length;const dt=parseDs(d);strip+=`<div class="day ${F.dia===d?'on':''}" data-day="${d}"><span>${k===0?'hoje':WD[dt.getDay()]}</span><b>${dt.getDate()}</b><i>${n?n+'•':''}</i></div>`;}
  strip+='</div>';
  let html=`<div class="hero"><h2>AGENDA</h2><div class="d">${L.length} item(ns) ${F.dia?`· <a href="#" data-day="">limpar dia</a>`:''}</div></div>${strip}
  <div class="flt">${sel('f_status',[['ABERTOS','Abertos'],['','Todos'],...STATUS.map(s=>[s,s])],F.status)}${sel('f_tipo',[['','Todos os tipos'],...TIPOS_ITEM.map(s=>[s,s])],F.tipo)}${sel('f_prio',[['','Todas prioridades'],...Object.entries(P_LABEL)],F.prio)}${sel('f_dir',[['','Todas direções'],['MIM','QUEM DEPENDE DE MIM'],['TERCEIRO','DE QUEM EU DEPENDO']],F.dir)}</div>
  <input class="inp" id="f_q" placeholder="🔎 buscar na agenda" value="${h(F.q)}" style="margin-bottom:8px">`;
  if(!L.length)return html+'<div class="card empty"><b>Nenhum item.</b>Ajuste os filtros ou crie pelo comando rápido.</div>';
  let cur=null;for(const it of L){const g=it.data<T&&isOpen(it)?'ATRASADOS':it.data;if(g!==cur){cur=g;html+=`<div class="dayh">${g==='ATRASADOS'?'⚠ ATRASADOS':fmtD(g)+' · '+relD(g)}</div>`;}html+=itemCard(it);}
  return html;
}

function logTable(logs,withC){if(!logs.length)return '<div class="small muted" style="padding-bottom:10px">Nenhuma alteração registrada.</div>';return `<div style="overflow-x:auto;padding-bottom:10px"><table class="log"><tr><th>DATA</th>${withC?'<th>CONTATO</th>':''}<th>EVENTO</th><th>ANTERIOR</th><th>NOVA</th><th>MOTIVO</th></tr>${logs.map(l=>`<tr><td>${fmtD(l.data)} ${l.data.slice(2,4)}</td>${withC?`<td>${h(cName(contact(l.contatoId)))}</td>`:''}<td>${h(l.evento)}</td><td>${l.anterior==null?'SEM HIST.':l.anterior}</td><td><b>${l.nova==null?'SEM HIST.':l.nova}</b>${l.anteriorExato!=null||l.novaExata!=null?`<br><span class="muted" style="font-size:10px">${l.anteriorExato??'—'}→${l.novaExata??'—'}</span>`:''}</td><td>${h(l.motivo)}</td></tr>`).join('')}</table></div>`;}

/* ---------- ANÁLISE ---------- */
function insights(){
  const MIN=S.settings.minEventosAnalise||3;const T=todayStr();const out=[];let hidden=0;
  const byC=cid=>S.events.filter(e=>e.contatoId===cid);
  for(const c of S.contacts){const ev=byC(c.id);
    const env=ev.filter(e=>e.tipo==='ORÇAMENTO ENVIADO').length,apr=ev.filter(e=>e.tipo==='ORÇAMENTO APROVADO').length;
    if(env>=MIN){const pc=Math.round(100*apr/env);if(pc<=34)out.push({cls:'bad',t:`${cName(c)} tem baixa conversão de orçamentos`,n:`${apr} convertido(s) de ${env} enviados (${pc}%). Revise preço/abordagem antes do próximo.`,cid:c.id});}
    else if(env>0&&apr/env<=.34)hidden++;
    if(['FORNECEDOR','FABRICANTE','REPRESENTANTE','PRESTADOR DE SERVIÇO'].includes(c.tipo)){const ent=ev.filter(e=>(e.tipo==='ENTREGA'||e.tipo==='COMPRA')&&e.dimensao==='COMPROMISSOS').sort((a,b)=>a.data<b.data?1:-1).slice(0,5);
      if(ent.length>=MIN){const late=ent.filter(e=>e.resultado==='NEG').length;if(late>=2)out.push({cls:'bad',t:`${cName(c)} atrasou ${late} das últimas ${ent.length} entregas`,n:`Programe pedidos com folga ou tenha fornecedor alternativo. ICI atual: ${(iciCompute(c.id)||{}).score??'—'}.`,cid:c.id});
        else if(late===0)out.push({cls:'good',t:`${cName(c)} entregou no prazo as últimas ${ent.length} entregas`,n:`0 atrasos registrados em ${ent.length} entregas.`,cid:c.id});}else if(ent.length)hidden++;}
    if(['CLIENTE','PROSPECT'].includes(c.tipo)){const pag=ev.filter(e=>e.dimensao==='FINANCEIRO'&&['PAGAMENTO','ATRASO'].includes(e.tipo));
      if(pag.length>=MIN){const neg=pag.filter(e=>e.resultado==='NEG').length;if(neg===0)out.push({cls:'good',t:`${cName(c)} sempre paga em dia`,n:`${pag.length} de ${pag.length} pagamentos registrados sem atraso.`,cid:c.id});
        else if(neg>=2)out.push({cls:'bad',t:`${cName(c)} atrasa pagamentos com frequência`,n:`${neg} de ${pag.length} pagamentos registrados com atraso/cobrança. Considere pagamento antecipado ou sinal.`,cid:c.id});}else if(pag.length)hidden++;}
    if(['TÉCNICO','PRESTADOR DE SERVIÇO'].includes(c.tipo)){const op=ev.filter(e=>e.dimensao==='OPERACIONAL'),cp=ev.filter(e=>e.dimensao==='COMPROMISSOS');
      if(op.length>=MIN&&cp.length>=MIN){const good=op.filter(e=>e.resultado==='POS').length,late=cp.filter(e=>e.resultado==='NEG').length;if(good/op.length>=.7&&late>=2)out.push({cls:'',t:`${cName(c)}: boa qualidade técnica, mas atrasos recorrentes`,n:`${good} de ${op.length} serviços avaliados positivamente; ${late} de ${cp.length} compromissos com atraso. Passe horários com margem.`,cid:c.id});}else if(op.length||cp.length)hidden++;}
  }
  const orc=allAlerts().filter(a=>a.kind==='orc_sem_follow');if(orc.length){const tot=orc.reduce((s,a)=>s+(a.valor||0),0);out.unshift({cls:'bad',t:`${brl(tot)} em orçamentos sem follow-up`,n:`${orc.length} orçamento(s) enviados há ≥${S.settings.diasOrcFollow} dias sem retorno registrado: ${orc.map(a=>a.text.split(': ').pop()).join(', ')}.`});}
  const cli=S.contacts.filter(c=>c.tipo==='CLIENTE');const withEv=cli.filter(c=>lastContact(c.id));
  if(withEv.length>=MIN){const inat=withEv.filter(c=>diffDays(lastContact(c.id),T)>(S.settings.diasInativo||60));if(inat.length)out.push({cls:'bad',t:`${inat.length} cliente(s) sem contato há mais de ${S.settings.diasInativo} dias`,n:inat.map(c=>`${cName(c)} (${diffDays(lastContact(c.id),T)}d)`).join(', ')});}else if(withEv.length)hidden++;
  const allE=S.events.filter(e=>e.tipo==='ORÇAMENTO ENVIADO').length,allA=S.events.filter(e=>e.tipo==='ORÇAMENTO APROVADO').length;if(allE>=MIN)out.push({cls:'',t:`Conversão geral de orçamentos: ${Math.round(100*allA/allE)}%`,n:`${allA} aprovados de ${allE} enviados (todos os contatos).`});
  const done=S.items.filter(i=>i.status==='CONCLUÍDO'&&i.concluidoEm);if(done.length>=5){const ok=done.filter(i=>i.concluidoEm<=i.data).length;out.push({cls:ok/done.length>=.8?'good':'',t:`${Math.round(100*ok/done.length)}% dos itens concluídos no prazo`,n:`${ok} de ${done.length} itens concluídos até a data prevista.`});}
  return {out,hidden};
}
function viewAnalise(){
  const {out,hidden}=insights();const rank=S.contacts.map(c=>({c,r:iciCompute(c.id)})).filter(x=>x.r).sort((a,b)=>b.r.score-a.r.score);
  let html=`<div class="hero"><h2>ANÁLISE</h2><div class="d">Padrões calculados estritamente a partir dos registros. Mínimo de ${S.settings.minEventosAnalise} eventos por padrão — sem dados, sem conclusão.</div></div>`;
  html+=secH('Padrões encontrados',out.length)+(out.length?out.map(x=>`<div class="card ins ${x.cls}" ${x.cid?`data-open-contact="${x.cid}"`:''}><b>${h(x.t)}</b><div class="num">${h(x.n)}</div></div>`).join(''):'<div class="card empty"><b>Dados insuficientes.</b>Registre eventos (orçamentos, pagamentos, entregas) para que padrões apareçam.</div>');
  if(hidden)html+=`<div class="small muted">${hidden} possível(is) padrão(ões) oculto(s) por dados insuficientes (menos de ${S.settings.minEventosAnalise} eventos).</div>`;
  html+=secH('Ranking de credibilidade (ICI)',rank.length)+(rank.length?`<div class="card">${rank.map(x=>`<div class="crow" data-open-contact="${x.c.id}" style="padding:6px 0;border-bottom:1px solid var(--bd)"><div class="b"><b>${h(cName(x.c))}</b><span class="small muted">${h(x.c.tipo)} · ${x.r.n} eventos</span></div>${iciBadge(x.c.id)}</div>`).join('')}</div>`:'');
  const semH=S.contacts.filter(c=>!iciCompute(c.id));if(semH.length)html+=`<div class="small muted">SEM HISTÓRICO: ${semH.map(c=>h(cName(c))).join(', ')}</div>`;
  html+=secH('Log do ICI (últimas 40 alterações)')+`<div class="card">${logTable(S.iciLog.slice().reverse().slice(0,40),true)}</div>`;
  return html;
}

function reschedule(it,nd,hora,motivo){const old=it.data;const delta=diffDays(old,nd);it.data=nd;if(hora!=null)it.hora=hora;

  if(it.status==='ATRASADO')it.status=it.statusAntes||'PENDENTE';hist(it,'REPROGRAMADO',fmtD(old)+' → '+fmtD(nd)+(motivo?' · motivo: '+motivo:''));save();}

function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
document.addEventListener('click',ev=>{
  const t=ev.target;
  const act=t.closest('[data-act]');
  if(act){ev.preventDefault();ev.stopPropagation();const a=act.dataset.act,id=act.dataset.id;
    switch(a){
      case 'close':closeSheet();break;
      case 'done':openDone(id);break;
      case 'resched':openResched(id);break;
      case 'cancel':openCancel(id);break;
      case 'event':openEventForm(act.dataset.cid,id);break;
      case 'newfor':{const k=act.dataset.kind;const tp=k==='orc_sem_follow'?'FOLLOW-UP':k==='oport_parada'?'VISITA COMERCIAL':'RETORNO AO CLIENTE';const c=contact(act.dataset.cid);const d=addDays(todayStr(),1);openItemForm(normalizeItem({tipo:tp,contatoId:act.dataset.cid,data:d,descricao:(tp==='FOLLOW-UP'?'Follow-up do orçamento':tp==='VISITA COMERCIAL'?'Retomar oportunidade':'Retornar contato')+' — '+cName(c),proximaAcao:'Ligar / WhatsApp',prazoProxima:d}),'new');break;}
      case 'newcontact':openContactForm();break;
      case 'editcontact':openContactForm(contact(act.dataset.cid));break;
      case 'delev':if(confirm('Remover este evento? A alteração no ICI ficará registrada no log.')){deleteEvent(act.dataset.eid);save();render();}break;
      case 'fab':openSheet(`<div class="hd"><h3>Criar</h3><button class="iconbtn" data-act="close">✕</button></div><div class="acts" style="flex-direction:column"><button data-act="newitem">📅 Novo compromisso / pendência</button><button data-act="newcontact">👤 Novo contato</button><button data-act="event">📝 Registrar evento</button></div><div class="small muted" style="margin-top:10px">Dica: a barra de comando rápido entende frases como “Cobrar João sexta se ele não pagar”.</div>`);break;
      case 'newitem':{const d=todayStr();openItemForm(normalizeItem({data:d,prazoProxima:d}),'new');break;}
      case 'sample':if(!S.contacts.length&&!S.items.length||confirm('Carregar dados de exemplo FICTÍCIOS? Isso substitui os dados atuais.')){loadSample();toast('Dados de exemplo (fictícios) carregados');go('hoje');render();}break;
      case 'wipe':if(prompt('Digite APAGAR para remover todos os dados deste navegador:')==='APAGAR'){S=emptyState();save();toast('Tudo apagado');go('hoje');render();}break;
      case 'export':download('officium-inexorabile-backup-'+todayStr()+'.json',JSON.stringify(S,null,1));break;
      case 'import':$('#impfile').click();break;
    }return;}
  const pr=t.closest('[data-preset]');if(pr){const p=PRESETS[+pr.dataset.preset];const f=$('#eventform');f.dimensao.value=p[1];f.resultado.value=p[2];f.severidade.value=p[3];f.tipo.value=p[4];if(!f.descricao.value)f.descricao.value=p[0];f.querySelectorAll('[data-preset]').forEach(x=>x.classList.toggle('on',x===pr));return;}
  const dp=t.closest('[data-dpreset]');if(dp){const f=$('#doneform');const on=!dp.classList.contains('on');f.querySelectorAll('[data-dpreset]').forEach(x=>x.classList.remove('on'));if(on)dp.classList.add('on');f.preset.value=on?dp.dataset.dpreset:'';return;}
  const tp=t.closest('[data-tpl]');if(tp){const f=$('#doneform');const x=f._tpl[+tp.dataset.tpl];f.ntipo.value=x.tipo;f.ndata.value=x.data;f.ndesc.value=x.desc;f.ndir.value=x.dir;f.querySelectorAll('[data-tpl]').forEach(y=>y.classList.toggle('on',y===tp));return;}
  const rd=t.closest('[data-rd]');if(rd){$('#reschform').data.value=rd.dataset.rd;document.querySelectorAll('[data-rd]').forEach(y=>y.classList.toggle('on',y===rd));return;}
  const dy=t.closest('[data-day]');if(dy){ev.preventDefault();F.dia=F.dia===dy.dataset.day?'':dy.dataset.day;render();return;}
  const gg=t.closest('[data-go]');if(gg){go(gg.dataset.go);return;}
  if(t.closest('[data-stop]'))return;
  if(t.closest('#ov')&&!t.closest('#sheet')){closeSheet();return;}
  const al=t.closest('[data-alert]');if(al){if(al.dataset.item){const it=S.items.find(i=>i.id===al.dataset.item);if(it)openItemForm(it,'edit');}else if(al.dataset.cid)go('contato/'+al.dataset.cid);return;}
  const oi=t.closest('[data-open-item]');if(oi){const it=S.items.find(i=>i.id===oi.dataset.openItem);if(it)openItemForm(it,'edit');return;}
  const oc=t.closest('[data-open-contact]');if(oc){go('contato/'+oc.dataset.openContact);return;}
});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;
  if(f.id==='itemform')submitItemForm(f);else if(f.id==='contactform')submitContactForm(f);else if(f.id==='eventform')submitEventForm(f);else if(f.id==='doneform')submitDone(f);
  else if(f.id==='reschform'){const it=S.items.find(i=>i.id===f.dataset.id);reschedule(it,f.data.value,f.hora.value,f.motivo.value.trim());closeSheet();toast('Reprogramado para '+fmtD(it.data));render();}
  else if(f.id==='cancelform'){const j=f.just.value.trim();if(j.length<5){const e=$('#cancerr');e.textContent='Cancelamento exige justificativa (mín. 5 caracteres).';e.classList.add('on');return;}const it=S.items.find(i=>i.id===f.dataset.id);it.status='CANCELADO';it.justificativa=j;hist(it,'CANCELADO',j);save();closeSheet();toast('Item cancelado com justificativa');render();}
  else if(f.id==='cfgform'){const fd=new FormData(f);const s=S.settings;s.responsaveis=fd.get('responsaveis').split('\n').map(x=>x.trim()).filter(Boolean);for(const k of ['diasSemContato','diasInativo','diasOrcFollow','diasOportParada','diasVencimento','minEventosAnalise'])s[k]=+fd.get(k)||DEFAULT_SETTINGS[k];s.notif=fd.get('notif')==='on';
    if(s.notif&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission();save();toast('Configurações salvas');render();}
  else if(f.id==='qcform')runQuick();
});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.name==='contatoId'&&t.form&&t.form.id==='itemform')$('#newcbox').style.display=t.value==='__new'?'grid':'none';
  if(t.name==='nonext')$('#nonextbox').style.display=t.checked?'block':'none';
  if(['f_status','f_tipo','f_prio','f_dir'].includes(t.name)){F[t.name.slice(2)]=t.value;render();}
  if(t.name==='c_tipo'){CF.tipo=t.value;$('#clist').innerHTML=contactList();}
  if(t.id==='impfile'&&t.files[0]){const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.contacts)||!Array.isArray(d.items))throw new Error('formato inválido');if(!confirm('Importar backup? Substitui os dados atuais.'))return;S=Object.assign(emptyState(),d);S.settings=Object.assign({},DEFAULT_SETTINGS,d.settings||{});save();toast('Backup importado');render();}catch(e){alert('Arquivo inválido: '+e.message);}};rd.readAsText(t.files[0]);t.value='';}
});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='c_q'){CF.q=t.value;$('#clist').innerHTML=contactList();}if(t.id==='f_q'){F.q=t.value;clearTimeout(t._d);t._d=setTimeout(()=>{render();const n=$('#f_q');n.focus();n.setSelectionRange(n.value.length,n.value.length);},350);}});
window.addEventListener('hashchange',()=>{closeSheet();render();window.scrollTo(0,0);});
const QC_EX=['Quarta-feira instalar réguas no Posto Energy, levar 2 breakaways 3/4','Cobrar João sexta se ele não pagar','Visitar TRR Arapongas amanhã às 10h','Orçamento para Posto Trevo dia 15 R$ 3.500','Comprar 4 swivels semana que vem'];
function init(){load();const n=iciDecayCheck();if(n)save();render();let k=0;setInterval(()=>{$('#qcin').placeholder='ex.: '+QC_EX[k++%QC_EX.length];},4000);setInterval(render,10*60*1000);}
window.AGENDA={get S(){return S;},parseCommand,iciCompute,priority,allAlerts,loadSample,validateItem,render};
init();

</script>
</body>
